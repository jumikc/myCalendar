<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日历">
  <title>日历</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="app">
    <section class="sheet">
      <div class="top">
        <h1>日历</h1>
        <button id="today" class="today-btn" type="button">今天</button>
      </div>
      <div class="month-row">
        <button id="prev" class="nav" type="button" aria-label="上个月">‹</button>
        <div class="month-title">
          <div id="year" class="year"></div>
          <div id="month" class="month"></div>
        </div>
        <button id="next" class="nav" type="button" aria-label="下个月">›</button>
      </div>
    </section>
    <div class="weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div id="grid" class="grid" role="grid" aria-label="月历"></div>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
  <script src="./vendor/lunar.js"></script>
  <script src="./js/model.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
